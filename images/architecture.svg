<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1200" height="980" viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg">

<style>
.title{
font:700 34px Arial;
fill:#1E3A8A;
}

.subtitle{
font:600 22px Arial;
fill:#334155;
}

.box{
fill:#ffffff;
stroke:#2563EB;
stroke-width:3;
rx:18;
ry:18;
}

.smallBox{
fill:#EFF6FF;
stroke:#3B82F6;
stroke-width:2;
rx:14;
ry:14;
}

.module{
fill:#F8FAFC;
stroke:#CBD5E1;
stroke-width:2;
rx:14;
ry:14;
}

.text{
font:600 20px Arial;
fill:#111827;
}

.smallText{
font:500 17px Arial;
fill:#374151;
}

.arrow{
stroke:#2563EB;
stroke-width:3;
fill:none;
marker-end:url(#arrow);
}

</style>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<polygon points="0 0,10 3,0 6" fill="#2563EB"></polygon>
</marker>
</defs>

<text x="600" y="50" text-anchor="middle" class="title">
Edviora Platform Architecture
</text>

<!-- USERS -->

<rect class="box" x="475" y="80" width="250" height="70"></rect>
<text x="600" y="123" text-anchor="middle" class="text">
Users
</text>

<!-- STUDENT -->

<rect class="smallBox" x="110" y="220" width="220" height="70"></rect>
<text x="220" y="263" text-anchor="middle" class="smallText">
👨‍🎓 Students
</text>

<!-- TEACHER -->

<rect class="smallBox" x="490" y="220" width="220" height="70"></rect>
<text x="600" y="263" text-anchor="middle" class="smallText">
👩‍🏫 Teachers
</text>

<!-- PARENTS -->

<rect class="smallBox" x="870" y="220" width="220" height="70"></rect>
<text x="980" y="263" text-anchor="middle" class="smallText">
👨‍👩‍👧 Parents
</text>

<!-- ARROWS -->

<line class="arrow" x1="600" y1="150" x2="220" y2="220"></line>
<line class="arrow" x1="600" y1="150" x2="600" y2="220"></line>
<line class="arrow" x1="600" y1="150" x2="980" y2="220"></line>

<!-- AUTH -->

<rect class="box" x="360" y="360" width="480" height="75"></rect>

<text x="600" y="405" text-anchor="middle" class="text">
🔐 Authentication System
</text>

<line class="arrow" x1="220" y1="290" x2="600" y2="360"></line>
<line class="arrow" x1="600" y1="290" x2="600" y2="360"></line>
<line class="arrow" x1="980" y1="290" x2="600" y2="360"></line>

<!-- DASHBOARD -->

<rect class="box" x="330" y="490" width="540" height="80"></rect>

<text x="600" y="538" text-anchor="middle" class="text">
🏫 Edviora Dashboard
</text>

<line class="arrow" x1="600" y1="435" x2="600" y2="490"></line>

<!-- MODULES -->

<rect class="module" x="90" y="640" width="1020" height="270"></rect>

<text x="600" y="685" text-anchor="middle" class="subtitle">
Core Platform Modules
</text>

<text x="180" y="740" class="smallText">📚 Student Management</text>
<text x="180" y="785" class="smallText">✅ Attendance</text>
<text x="180" y="830" class="smallText">💰 Fees &amp; Billing</text>

<text x="480" y="740" class="smallText">🤖 AI Assistant</text>
<text x="480" y="785" class="smallText">📄 Reports</text>
<text x="480" y="830" class="smallText">📅 Timetable</text>

<text x="760" y="740" class="smallText">👨‍💼 Payroll</text>
<text x="760" y="785" class="smallText">📢 Notifications</text>
<text x="760" y="830" class="smallText">🚌 Transport</text>
<text x="760" y="875" class="smallText">📊 Analytics</text>

<line class="arrow" x1="600" y1="570" x2="600" y2="640"></line>

<!-- DATABASE -->

<rect class="box" x="420" y="930" width="360" height="40"></rect>

<text x="600" y="957" text-anchor="middle" class="smallText">
🗄️ Secure Cloud Database
</text>

<line class="arrow" x1="600" y1="910" x2="600" y2="930"></line>

</svg>